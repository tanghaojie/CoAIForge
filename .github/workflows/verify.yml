name: Verify CoAIForge
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  governance:
    strategy:
      matrix:
        toolchain:
          - { node: '20.19.0', pnpm: '10.26.0' }
          - { node: '22.13.0', pnpm: '11.13.1' }
          - { node: '24', pnpm: '12' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ matrix.toolchain.pnpm }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.toolchain.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm docs:check
      - run: pnpm modules:check
      - run: pnpm docs:archive:check:ci
      - run: pnpm commits:check
  presets:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        preset: [frontend, backend, fullstack]
        toolchain:
          - { node: '20.19.0', pnpm: '10.26.0' }
          - { node: '22.13.0', pnpm: '11.13.1' }
          - { node: '24', pnpm: '12' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ matrix.toolchain.pnpm }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.toolchain.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:verify -- --preset ${{ matrix.preset }}
